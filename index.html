<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PR Abdelnaser | Enterprise Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glass Background */
        .ambient-light {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: -1;
            animation: pulse 12s infinite alternate;
        }
        .light-1 { width: 500px; height: 500px; background: rgba(99, 102, 241, 0.4); top: -150px; left: -150px; }
        .light-2 { width: 400px; height: 400px; background: rgba(236, 72, 153, 0.3); bottom: -100px; right: 10%; animation-delay: -5s; }
        .light-3 { width: 600px; height: 600px; background: rgba(16, 185, 129, 0.2); top: 40%; left: 40%; transform: translate(-50%, -50%); animation-delay: -2s; }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.3) translate(50px, 30px); }
        }

        /* Glassmorphism Utility */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* Header & Hierarchy */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 40px;
        }

        .brand h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #c084fc, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }
        .brand p {
            color: #94a3b8;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Executive Board */
        .executive-board {
            display: flex;
            gap: 20px;
        }
        .exec-card {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 25px;
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }
        .exec-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: #6366f1;
        }
        .exec-card:nth-child(2)::before { background: #ec4899; }
        
        .exec-info h3 { font-size: 1.2rem; color: #fff; }
        .exec-info span { font-size: 0.85rem; color: #34d399; font-weight: 600; text-transform: uppercase; }

        /* Dashboard Global Stats */
        .global-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .stat-box {
            padding: 30px;
            text-align: center;
            transition: transform 0.4s ease;
        }
        .stat-box:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.05);
        }
        .stat-box h4 { color: #94a3b8; font-weight: 400; text-transform: uppercase; letter-spacing: 1px; }
        .stat-box h2 { font-size: 3.5rem; font-weight: 800; margin-top: 10px; }
        .text-gradient {
            background: linear-gradient(to right, #4ade80, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Operations Team Grid */
        .section-title {
            font-size: 1.8rem;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .section-title::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(255,255,255,0.2), transparent);
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 25px;
        }

        /* Advanced Hover Card */
        .emp-card {
            position: relative;
            padding: 25px;
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            z-index: 1;
        }

        .emp-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(99,102,241,0.1) 100%);
            opacity: 0;
            transition: opacity 0.5s;
            z-index: -1;
        }

        .emp-card:hover {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(99, 102, 241, 0.2);
        }

        .emp-card:hover::before { opacity: 1; }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
        }
        .emp-identity h3 { font-size: 1.4rem; font-weight: 600; }
        .emp-role { font-size: 0.9rem; color: #94a3b8; }
        .emp-id { 
            background: rgba(255,255,255,0.1); 
            padding: 5px 12px; 
            border-radius: 30px; 
            font-size: 0.8rem; 
            font-weight: 600; 
            letter-spacing: 1px;
        }

        /* Basic Stats (Always Visible) */
        .basic-stats {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
            transition: opacity 0.3s;
        }
        .stat-item p { font-size: 0.8rem; color: #64748b; }
        .stat-item h5 { font-size: 1.2rem; font-weight: 600; }

        /* Expanded Details (Revealed on Hover) */
        .expanded-details {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 0;
        }

        .emp-card:hover .expanded-details {
            max-height: 150px;
            opacity: 1;
            margin-top: 20px;
            border-top: 1px dashed rgba(255,255,255,0.2);
            padding-top: 20px;
        }

        .profit-highlight {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .profit-highlight span { font-size: 0.9rem; color: #cbd5e1; }
        .profit-highlight h2 { font-size: 1.8rem; color: #10b981; }

        .progress-wrapper { width: 100%; background: rgba(255,255,255,0.1); height: 6px; border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 10px; }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px;
            margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        footer p {
            color: #64748b;
            font-size: 0.9rem;
            margin: 5px 0;
        }
        .signature {
            color: #94a3b8;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .app-name {
            background: linear-gradient(90deg, #f59e0b, #ef4444);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

    </style>
</head>
<body>

    <!-- Ambient Lights -->
    <div class="ambient-light light-1"></div>
    <div class="ambient-light light-2"></div>
    <div class="ambient-light light-3"></div>

    <div class="container">
        
        <!-- Header & Executive Board -->
        <header class="glass-panel">
            <div class="brand">
                <h1>PR Abdelnaser</h1>
                <p>Enterprise Management Console</p>
            </div>
            
            <div class="executive-board">
                <div class="exec-card">
                    <div class="exec-info">
                        <h3>Eng. Abdel Nasser</h3>
                        <span>Chief Executive Officer</span>
                    </div>
                </div>
                <div class="exec-card">
                    <div class="exec-info">
                        <h3>Ahmed Abdallah</h3>
                        <span>Managing Director</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Global Statistics -->
        <section class="global-stats">
            <div class="stat-box glass-panel">
                <h4>Total Revenue</h4>
                <h2 id="total-revenue" class="text-gradient">$0</h2>
            </div>
            <div class="stat-box glass-panel">
                <h4>Completed Orders</h4>
                <h2 id="total-orders">0</h2>
            </div>
            <div class="stat-box glass-panel">
                <h4>Active Developers</h4>
                <h2 id="total-devs">0</h2>
            </div>
        </section>

        <!-- Operations Team -->
        <section class="team-section">
            <h2 class="section-title">Operations & Development Team</h2>
            <div class="team-grid" id="team-grid">
                <!-- Cards injected via JS -->
            </div>
        </section>

    </div>

    <!-- Official Signature Footer -->
    <footer>
        <p class="signature">Developed & Designed by Eng. Abdel Nasser</p>
        <p class="app-name">Ramadan Kareem</p>
    </footer>

    <script>
        // Enterprise Dummy Data
        const teamData = [
            { id: 'DEV-801', name: 'Marcus Chen', role: 'Senior Full-Stack', orders: 412, profit: 12450, efficiency: 95 },
            { id: 'DEV-802', name: 'Sarah Jenkins', role: 'UI/UX Architect', orders: 289, profit: 8900, efficiency: 88 },
            { id: 'DEV-803', name: 'Omar Al-Fayed', role: 'Backend Engineer', orders: 530, profit: 15600, efficiency: 98 },
            { id: 'DEV-804', name: 'Elena Rostova', role: 'DevOps Specialist', orders: 156, profit: 6200, efficiency: 75 },
            { id: 'DEV-805', name: 'David Kim', role: 'Frontend Developer', orders: 340, profit: 9100, efficiency: 82 },
            { id: 'DEV-806', name: 'Aisha Rahman', role: 'Data Scientist', orders: 198, profit: 11200, efficiency: 91 },
            { id: 'DEV-807', name: 'James Wilson', role: 'QA Tester', orders: 480, profit: 5400, efficiency: 85 },
            { id: 'DEV-808', name: 'Lucas Silva', role: 'Mobile Developer', orders: 275, profit: 10800, efficiency: 89 }
        ];

        // Format Currency
        const formatMoney = (amount) => {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(amount);
        };

        // Calculate Global Totals
        const totalRev = teamData.reduce((acc, curr) => acc + curr.profit, 0);
        const totalOrd = teamData.reduce((acc, curr) => acc + curr.orders, 0);

        // Animate Numbers (Simple Counter)
        document.getElementById('total-revenue').innerText = formatMoney(totalRev);
        document.getElementById('total-orders').innerText = totalOrd.toLocaleString();
        document.getElementById('total-devs').innerText = teamData.length;

        // Render Grid
        const grid = document.getElementById('team-grid');

        teamData.forEach((member, index) => {
            const card = document.createElement('div');
            card.className = 'emp-card glass-panel';
            
            // Staggered entry animation delay (CSS setup skipped for brevity, inline logic here)
            card.style.animation = `fadeInUp 0.6s ease forwards ${index * 0.1}s`;
            card.style.opacity = '0'; // Will be animated in a real app, but statically visible here
            
            // To ensure they show up without defining keyframes in this snippet:
            setTimeout(() => card.style.opacity = '1', index * 100);

            card.innerHTML = `
                <div class="card-header">
                    <div class="emp-identity">
                        <h3>${member.name}</h3>
                        <p class="emp-role">${member.role}</p>
                    </div>
                    <span class="emp-id">${member.id}</span>
                </div>
                
                <div class="basic-stats">
                    <div class="stat-item">
                        <p>Orders Done</p>
                        <h5>${member.orders}</h5>
                    </div>
                    <div class="stat-item" style="text-align: right;">
                        <p>Status</p>
                        <h5 style="color: #34d399;">Active</h5>
                    </div>
                </div>

                <!-- Template hidden by default, expands on Hover -->
                <div class="expanded-details">
                    <div class="profit-highlight">
                        <span>Generated Profit</span>
                        <h2>${formatMoney(member.profit)}</h2>
                    </div>
                    <div style="margin-top: 10px;">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.8rem; color: #94a3b8;">
                            <span>Efficiency Rate</span>
                            <span>${member.efficiency}%</span>
                        </div>
                        <div class="progress-wrapper">
                            <div class="progress-bar" style="width: ${member.efficiency}%;"></div>
                        </div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
