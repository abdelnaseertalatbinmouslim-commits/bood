<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PR Abdelnaser | Enterprise Dashboard</title>

    <!-- Fonts: use link + preconnect for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet" />

    <style>
        /* Base */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body {
            background-color: #050505;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Ambient Glass Background */
        .ambient-light {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: pulse 12s infinite alternate;
            will-change: transform;
            pointer-events: none;
        }
        .light-1 { width: 500px; height: 500px; background: rgba(99, 102, 241, 0.4); top: -150px; left: -150px; }
        .light-2 { width: 400px; height: 400px; background: rgba(236, 72, 153, 0.3); bottom: -100px; right: 10%; animation-delay: -5s; }
        .light-3 { width: 600px; height: 600px; background: rgba(16, 185, 129, 0.2); top: 40%; left: 40%; transform: translate(-50%, -50%); animation-delay: -2s; }

        @keyframes pulse {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.3) translate(50px, 30px); }
        }

        /* Glassmorphism Utility (with fallback) */
        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        /* Container */
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        /* Header & Brand */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px 40px;
        }

        .brand h1 {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #c084fc, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }
        .brand p {
            color: #94a3b8;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .executive-board { display: flex; gap: 20px; }
        .exec-card {
            display: flex; align-items: center; gap: 15px;
            padding: 15px 25px;
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border-radius: 16px; border: 1px solid rgba(255,255,255,0.1);
            position: relative; overflow: hidden;
        }
        .exec-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%;
            background: #6366f1;
        }
        .exec-card:nth-child(2)::before { background: #ec4899; }
        .exec-info h3 { font-size: 1.2rem; color: #fff; }
        .exec-info span { font-size: 0.85rem; color: #34d399; font-weight: 600; text-transform: uppercase; }

        /* Global Stats */
        .global-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }
        .stat-box {
            padding: 30px;
            text-align: center;
            transition: transform 0.4s ease;
        }
        .stat-box:hover { transform: translateY(-5px); background: rgba(255,255,255,0.03); }
        .stat-box h4 { color: #94a3b8; font-weight: 400; text-transform: uppercase; letter-spacing: 1px; }
        .stat-box h2 { font-size: 3.5rem; font-weight: 800; margin-top: 10px; }
        .text-gradient {
            background: linear-gradient(to right, #4ade80, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Team Section */
        .section-title { font-size: 1.8rem; margin-bottom: 20px; display: flex; align-items: center; gap: 15px; }
        .section-title::after {
            content: ''; flex-grow: 1; height: 1px; background: linear-gradient(to right, rgba(255,255,255,0.2), transparent);
        }
        .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }

        /* Employee Card */
        .emp-card {
            position: relative; padding: 25px; border-radius: 20px; overflow: hidden;
            transition: transform 0.5s cubic-bezier(0.4,0,0.2,1), box-shadow 0.3s, border-color 0.3s;
            cursor: pointer; z-index: 1; will-change: transform;
            outline: none;
            opacity: 0; /* start hidden, will be revealed by animation */
        }

        @keyframes fadeInUp {
            from { transform: translateY(10px); opacity: 0; }
            to   { transform: translateY(0);  opacity: 1; }
        }

        .emp-card::before {
            content: '';
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(99,102,241,0.06) 100%);
            opacity: 0; transition: opacity 0.5s; z-index: -1;
        }

        .emp-card:hover, .emp-card:focus, .emp-card.is-expanded {
            transform: translateY(-10px) scale(1.02);
            border-color: rgba(99, 102, 241, 0.4);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(99, 102, 241, 0.12);
        }

        .emp-card:hover::before, .emp-card:focus::before, .emp-card.is-expanded::before { opacity: 1; }

        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
        .emp-identity h3 { font-size: 1.4rem; font-weight: 600; }
        .emp-role { font-size: 0.9rem; color: #94a3b8; }
        .emp-id { background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 30px; font-size: 0.8rem; font-weight: 600; letter-spacing: 1px; }

        .basic-stats {
            display: flex; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px; transition: opacity 0.3s;
        }
        .stat-item p { font-size: 0.8rem; color: #64748b; }
        .stat-item h5 { font-size: 1.2rem; font-weight: 600; }

        .expanded-details {
            max-height: 0; opacity: 0; overflow: hidden; transition: all 0.5s cubic-bezier(0.4,0,0.2,1); margin-top: 0;
        }
        .emp-card:hover .expanded-details, .emp-card:focus .expanded-details, .emp-card.is-expanded .expanded-details {
            max-height: 200px; opacity: 1; margin-top: 20px;
            border-top: 1px dashed rgba(255,255,255,0.12); padding-top: 20px;
        }

        .profit-highlight { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .profit-highlight span { font-size: 0.9rem; color: #cbd5e1; }
        .profit-highlight h2 { font-size: 1.8rem; color: #10b981; }

        .progress-wrapper { width: 100%; background: rgba(255,255,255,0.06); height: 6px; border-radius: 10px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #3b82f6, #8b5cf6); border-radius: 10px; transition: width 0.6s ease; }

        /* Footer */
        footer { text-align: center; padding: 40px; margin-top: 20px; border-top: 1px solid rgba(255,255,255,0.05); }
        footer p { color: #64748b; font-size: 0.9rem; margin: 5px 0; }
        .signature { color: #94a3b8; font-weight: 600; letter-spacing: 1px; }
        .app-name {
            background: linear-gradient(90deg, #f59e0b, #ef4444);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 800;
        }

        /* Focus styles for accessibility */
        .emp-card:focus { box-shadow: 0 0 0 3px rgba(59,130,246,0.15), 0 20px 40px rgba(0,0,0,0.5); }

        /* Responsive */
        @media (max-width: 900px) {
            .global-stats { grid-template-columns: 1fr; }
            header { flex-direction: column; align-items: flex-start; gap: 20px; padding: 20px; }
            .brand h1 { font-size: 2rem; }
        }

        /* Respect user preference for reduced motion */
        @media (prefers-reduced-motion: reduce) {
            .emp-card, .ambient-light, .stat-box { animation: none !important; transition: none !important; }
        }
    </style>
</head>
<body>
    <!-- Ambient Lights -->
    <div class="ambient-light light-1" aria-hidden="true"></div>
    <div class="ambient-light light-2" aria-hidden="true"></div>
    <div class="ambient-light light-3" aria-hidden="true"></div>

    <main>
        <div class="container">
            <!-- Header & Executive Board -->
            <header class="glass-panel" role="banner" aria-label="Top header">
                <div class="brand">
                    <h1>PR Abdelnaser</h1>
                    <p>Enterprise Management Console</p>
                </div>

                <div class="executive-board" aria-hidden="false">
                    <div class="exec-card">
                        <div class="exec-info">
                            <h3>Eng. Abdel Nasser</h3>
                            <span>Chief Executive Officer</span>
                        </div>
                    </div>
                    <div class="exec-card">
                        <div class="exec-info">
                            <h3>Ahmed Abdallah</h3>
                            <span>Managing Director</span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Global Statistics -->
            <section class="global-stats" aria-labelledby="stats-heading" role="region">
                <h2 id="stats-heading" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;">Global statistics</h2>
                <div class="stat-box glass-panel" aria-hidden="false">
                    <h4>Total Revenue</h4>
                    <h2 id="total-revenue" class="text-gradient" aria-live="polite">$0</h2>
                </div>
                <div class="stat-box glass-panel">
                    <h4>Completed Orders</h4>
                    <h2 id="total-orders" aria-live="polite">0</h2>
                </div>
                <div class="stat-box glass-panel">
                    <h4>Active Developers</h4>
                    <h2 id="total-devs" aria-live="polite">0</h2>
                </div>
            </section>

            <!-- Operations Team -->
            <section class="team-section" aria-label="Operations and development team">
                <h2 class="section-title">Operations & Development Team</h2>
                <div class="team-grid" id="team-grid" role="list" aria-label="Team members grid">
                    <!-- Cards injected via JS -->
                </div>
            </section>
        </div>
    </main>

    <!-- Official Signature Footer -->
    <footer role="contentinfo">
        <p class="signature">Developed & Designed by Eng. Abdel Nasser</p>
        <p class="app-name">Ramadan Kareem</p>
    </footer>

    <script>
        // Enterprise Dummy Data
        const teamData = [
            { id: 'DEV-801', name: 'Marcus Chen', role: 'Senior Full-Stack', orders: 412, profit: 12450, efficiency: 95 },
            { id: 'DEV-802', name: 'Sarah Jenkins', role: 'UI/UX Architect', orders: 289, profit: 8900, efficiency: 88 },
            { id: 'DEV-803', name: 'Omar Al-Fayed', role: 'Backend Engineer', orders: 530, profit: 15600, efficiency: 98 },
            { id: 'DEV-804', name: 'Elena Rostova', role: 'DevOps Specialist', orders: 156, profit: 6200, efficiency: 75 },
            { id: 'DEV-805', name: 'David Kim', role: 'Frontend Developer', orders: 340, profit: 9100, efficiency: 82 },
            { id: 'DEV-806', name: 'Aisha Rahman', role: 'Data Scientist', orders: 198, profit: 11200, efficiency: 91 },
            { id: 'DEV-807', name: 'James Wilson', role: 'QA Tester', orders: 480, profit: 5400, efficiency: 85 },
            { id: 'DEV-808', name: 'Lucas Silva', role: 'Mobile Developer', orders: 275, profit: 10800, efficiency: 89 }
        ];

        // Format Currency
        const formatMoney = (amount) => {
            return new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(amount);
        };

        // Calculate Global Totals
        const totalRev = teamData.reduce((acc, curr) => acc + curr.profit, 0);
        const totalOrd = teamData.reduce((acc, curr) => acc + curr.orders, 0);

        // Inject global totals
        document.getElementById('total-revenue').textContent = formatMoney(totalRev);
        document.getElementById('total-orders').textContent = totalOrd.toLocaleString();
        document.getElementById('total-devs').textContent = String(teamData.length);

        // Render Grid safely (no innerHTML)
        const grid = document.getElementById('team-grid');

        function createCard(member, index) {
            const card = document.createElement('article');
            card.className = 'emp-card glass-panel';
            // Set animation with staggered delay
            card.style.animation = `fadeInUp 0.6s ease ${index * 0.08}s both`;
            card.setAttribute('tabindex', '0');
            card.setAttribute('role', 'button');
            card.setAttribute('aria-expanded', 'false');

            // Click/keyboard toggle expands details
            const toggleExpand = () => {
                const expanded = card.classList.toggle('is-expanded');
                card.setAttribute('aria-expanded', expanded ? 'true' : 'false');
            };

            card.addEventListener('click', (e) => {
                // allow clicks on interactive children in future; here toggle
                toggleExpand();
            });

            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleExpand();
                }
            });

            // Header
            const header = document.createElement('div');
            header.className = 'card-header';

            const identity = document.createElement('div');
            identity.className = 'emp-identity';

            const h3 = document.createElement('h3');
            h3.textContent = member.name;

            const pRole = document.createElement('p');
            pRole.className = 'emp-role';
            pRole.textContent = member.role;

            identity.appendChild(h3);
            identity.appendChild(pRole);

            const spanId = document.createElement('span');
            spanId.className = 'emp-id';
            spanId.textContent = member.id;

            header.appendChild(identity);
            header.appendChild(spanId);

            // Basic stats
            const basic = document.createElement('div');
            basic.className = 'basic-stats';

            const statLeft = document.createElement('div');
            statLeft.className = 'stat-item';
            const statLeftP = document.createElement('p'); statLeftP.textContent = 'Orders Done';
            const statLeftH = document.createElement('h5'); statLeftH.textContent = String(member.orders);
            statLeft.appendChild(statLeftP); statLeft.appendChild(statLeftH);

            const statRight = document.createElement('div');
            statRight.className = 'stat-item';
            statRight.style.textAlign = 'right';
            const statRightP = document.createElement('p'); statRightP.textContent = 'Status';
            const statRightH = document.createElement('h5'); statRightH.style.color = '#34d399'; statRightH.textContent = 'Active';
            statRight.appendChild(statRightP); statRight.appendChild(statRightH);

            basic.appendChild(statLeft); basic.appendChild(statRight);

            // Expanded details
            const expanded = document.createElement('div');
            expanded.className = 'expanded-details';

            const profitWrap = document.createElement('div');
            profitWrap.className = 'profit-highlight';
            const profitLabel = document.createElement('span'); profitLabel.textContent = 'Generated Profit';
            const profitVal = document.createElement('h2'); profitVal.textContent = formatMoney(member.profit);
            profitWrap.appendChild(profitLabel); profitWrap.appendChild(profitVal);

            const effWrap = document.createElement('div');
            effWrap.style.marginTop = '10px';
            const effRow = document.createElement('div');
            effRow.style.display = 'flex'; effRow.style.justifyContent = 'space-between';
            effRow.style.marginBottom = '5px'; effRow.style.fontSize = '0.8rem'; effRow.style.color = '#94a3b8';
            const effLabel = document.createElement('span'); effLabel.textContent = 'Efficiency Rate';
            const effVal = document.createElement('span'); effVal.textContent = `${member.efficiency}%`;
            effRow.appendChild(effLabel); effRow.appendChild(effVal);

            const progWrap = document.createElement('div');
            progWrap.className = 'progress-wrapper';
            const progBar = document.createElement('div');
            progBar.className = 'progress-bar';
            progBar.style.width = `${member.efficiency}%`;
            progWrap.appendChild(progBar);

            effWrap.appendChild(effRow);
            effWrap.appendChild(progWrap);

            expanded.appendChild(profitWrap);
            expanded.appendChild(effWrap);

            // Assemble
            card.appendChild(header);
            card.appendChild(basic);
            card.appendChild(expanded);

            return card;
        }

        teamData.forEach((member, index) => {
            const card = createCard(member, index);
            grid.appendChild(card);
        });

        // Optional: if you want to programmatically expand the first card for demonstration:
        // const firstCard = grid.querySelector('.emp-card');
        // if (firstCard) { firstCard.classList.add('is-expanded'); firstCard.setAttribute('aria-expanded','true'); }
    </script>
</body>
</html>
